<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm Đơn Mua Hàng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4 mb-5" style="max-width: 600px;">
    <h2 class="mb-4">Thêm Đơn Mua Hàng Mới</h2>
    
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Mã chi phí</label>
            <input type="text" name="cost_code" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Mã vật tư</label>
            <input type="text" name="item_code" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Tên vật tư (*)</label>
            <input type="text" name="item_name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Số PO</label>
            <input type="text" name="po_number" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Nhà cung cấp</label>
            <input type="text" name="supplier" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Số lượng (*)</label>
            <input type="number" name="quantity" class="form-control" required min="1">
        </div>
        <div class="mb-3">
            <label class="form-label">Đơn giá (*)</label>
            <input type="number" step="any" name="unit_price" class="form-control" required min="0">
        </div>
        <div class="mb-3">
            <label class="form-label">Ngày đặt (*)</label>
            <input type="date" name="order_date" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Dự kiến nhận (*)</label>
            <input type="date" name="expected_date" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Trạng thái ban đầu</label>
            <select name="status" class="form-select">
                <option value="Đang đặt">Đang đặt</option>
                <option value="Đang vận chuyển">Đang vận chuyển</option>
                <option value="Đã nhận">Đã nhận</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Ngày nhận thực tế (nếu đã nhận)</label>
            <input type="date" name="received_date" class="form-control">
        </div>
        <!-- Thêm tùy chọn đánh giá vật tư -->
        <div class="mb-3">
            <label class="form-label">Đánh giá vật tư</label>
            <select name="evaluation" class="form-select">
                <option value="Chưa">Chưa</option>
                <option value="Có">Có</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Lưu đơn hàng</button>
        <a href="{{ url_for('list_purchases') }}" class="btn btn-secondary">Hủy</a>
    </form>
</body>
</html>
