<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm Đơn Mua Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4 mb-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Thêm Đơn Mua Hàng Mới</h4>
            </div>
            <div class="card-body">
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Mã Chi Phí (Cost Code)</label>
                            <input type="text" class="form-control" name="cost_code">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Số PO</label>
                            <input type="text" class="form-control" name="po_number" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mục Đích Sử Dụng</label>
                        <textarea class="form-control" name="purpose" rows="2"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Mã Vật Tư</label>
                            <input type="text" class="form-control" name="item_code">
                        </div>
                        <div class="col-md-8 mb-3">
                            <label class="form-label">Tên Vật Tư <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="item_name" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nhà Cung Cấp <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="supplier" required>
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">ĐVT</label>
                            <input type="text" class="form-control" name="unit">
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Số Lượng <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" name="quantity" required>
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Đơn Giá <span class="text-danger">*</span></label>
                            <input type="number" step="any" class="form-control" name="unit_price" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Ngày SC Nhận Phiếu YC</label>
                            <input type="date" class="form-control" name="sc_received_date">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Ngày Dự Kiến Hàng Về</label>
                            <input type="date" class="form-control" name="expected_date">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Ngày Nhận Thực Tế</label>
                            <input type="date" class="form-control" name="received_date">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Trạng Thái</label>
                            <select class="form-select" name="status">
                                <option value="Chưa nhận">Chưa nhận</option>
                                <option value="Nhận 1 phần">Nhận 1 phần</option>
                                <option value="Đã giao">Đã giao</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Đánh Giá Vật Tư</label>
                            <input type="text" class="form-control" name="evaluation" value="chưa">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('list_purchases') }}" class="btn btn-secondary">Quay Lại</a>
                        <button type="submit" class="btn btn-primary">Lưu Đơn Hàng</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
