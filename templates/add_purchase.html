<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm Đơn Mua Hàng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4 mb-5" style="max-width: 700px;">
    <h2>Thêm Đơn Mua Hàng Mới</h2>
    
    <form method="POST" class="mt-3">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Mã chi phí</label>
                <input type="text" name="cost_code" class="form-control" placeholder="Nhập mã chi phí (nếu có)">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Mã vật tư</label>
                <input type="text" name="item_code" class="form-control" placeholder="Nhập mã vật tư">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Tên vật tư <span class="text-danger">*</span></label>
            <input type="text" name="item_name" class="form-control" required placeholder="Nhập tên vật tư">
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Số PO</label>
                <input type="text" name="po_number" class="form-control" placeholder="Số đơn hàng PO">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Nhà cung cấp</label>
                <input type="text" name="supplier" class="form-control" placeholder="Tên nhà cung cấp">
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Số lượng <span class="text-danger">*</span></label>
                <input type="number" name="quantity" class="form-control" required min="1" value="1">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Đơn giá (VNĐ) <span class="text-danger">*</span></label>
                <input type="number" step="any" name="unit_price" class="form-control" required placeholder="0">
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Ngày đặt hàng</label>
                <input type="date" name="order_date" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Dự kiến nhận</label>
                <input type="date" name="expected_date" class="form-control">
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Trạng thái</label>
                <select name="status" class="form-select">
                    <option value="Đang đặt">Đang đặt</option>
                    <option value="Đang vận chuyển">Đang vận chuyển</option>
                    <option value="Đã nhận">Đã nhận</option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Ngày nhận thực tế</label>
                <input type="date" name="received_date" class="form-control">
                <small class="text-muted">Nếu điền ngày này, trạng thái sẽ tự động đổi thành "Đã nhận".</small>
            </div>
        </div>

        <button type="submit" class="btn btn-success">Lưu đơn hàng</button>
        <a href="{{ url_for('list_purchases') }}" class="btn btn-secondary">Quay lại</a>
    </form>
</body>
</html>
