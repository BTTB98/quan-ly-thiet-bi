<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm tài khoản mới</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5" style="max-width: 500px;">
    <h2>Thêm tài khoản người dùng</h2>
    <form method="POST" class="mt-3">
        <div class="mb-3">
            <label class="form-label">Tên đăng nhập</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Vai trò (Role)</label>
            <select name="role" class="form-select">
                <option value="staff">Nhân viên (Staff - Chỉ xem, không được sửa)</option>
                <option value="admin">Quản trị viên (Admin - Toàn quyền)</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Tạo tài khoản</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Quay lại</a>
    </form>
</body>
</html>
