<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm tài khoản nhân viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i>Tạo Tài Khoản Mới</h4>
            </div>
            <div class="card-body">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Tên đăng nhập (Username):</label>
                        <input type="text" class="form-control" name="username" required placeholder="Nhập tên đăng nhập...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mật khẩu (Password):</label>
                        <input type="password" class="form-control" name="password" required placeholder="Nhập mật khẩu...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phân quyền hệ thống:</label>
                        <select name="role" class="form-select">
                            <option value="viewer">Nhân viên (Chỉ xem dữ liệu & Xuất Excel)</option>
                            <option value="admin">Admin (Toàn quyền quản lý, thêm, sửa)</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('list_users') }}" class="btn btn-secondary"><i class="fas fa-arrow-left me-1"></i> Quay lại</a>
                        <button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i> Lưu tài khoản</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
