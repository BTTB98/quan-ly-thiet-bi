<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật đơn mua hàng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4" style="max-width: 600px;">
    <h2>Chỉnh sửa đơn mua hàng #{{ purchase.id }}</h2>
    <form method="POST" class="mt-3">
        <div class="mb-3">
            <label class="form-label">Mã vật tư</label>
            <input type="text" name="item_code" class="form-control" value="{{ purchase.item_code or '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Tên vật tư (*)</label>
            <input type="text" name="item_name" class="form-control" value="{{ purchase.item_name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Số PO</label>
            <input type="text" name="po_number" class="form-control" value="{{ purchase.po_number or '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Nhà cung cấp</label>
            <input type="text" name="supplier" class="form-control" value="{{ purchase.supplier or '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Số lượng (*)</label>
            <input type="number" name="quantity" class="form-control" value="{{ purchase.quantity }}" required min="1">
        </div>
        <div class="mb-3">
            <label class="form-label">Đơn giá (*)</label>
            <input type="number" step="any" name="unit_price" class="form-control" value="{{ purchase.unit_price }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Ngày đặt mua</label>
            <input type="date" name="order_date" class="form-control" value="{{ purchase.order_date or '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Ngày nhận hàng dự kiến</label>
            <input type="date" name="expected_date" class="form-control" value="{{ purchase.expected_date or '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Trạng thái</label>
            <select name="status" class="form-select">
                <option value="Đã đặt hàng" {% if purchase.status == 'Đã đặt hàng' %}selected{% endif %}>Đã đặt hàng</option>
                <option value="Đang giao" {% if purchase.status == 'Đang giao' %}selected{% endif %}>Đang giao</option>
                <option value="Đã nhận" {% if purchase.status == 'Đã nhận' %}selected{% endif %}>Đã nhận</option>
                <option value="Đã hủy" {% if purchase.status == 'Đã hủy' %}selected{% endif %}>Đã hủy</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Ngày nhận hàng thực tế</label>
            <input type="date" name="received_date" class="form-control" value="{{ purchase.received_date or '' }}">
        </div>
        <button type="submit" class="btn btn-primary">Cập nhật</button>
        <a href="{{ url_for('list_purchases') }}" class="btn btn-secondary">Hủy</a>
    </form>
</body>
</html>
