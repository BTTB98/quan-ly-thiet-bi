<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa đơn hàng</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome cho icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container mt-4 mb-5" style="max-width: 700px;">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0"><i class="fas fa-edit me-2"></i>Chỉnh Sửa Đơn Mua Hàng #{{ purchase.id }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Mã CP:</label>
                            <input type="text" class="form-control" name="cost_code" value="{{ purchase.cost_code }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Mục đích:</label>
                            <input type="text" class="form-control" name="purpose" value="{{ purchase.purpose }}">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Mã vật tư:</label>
                            <input type="text" class="form-control" name="item_code" value="{{ purchase.item_code }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Tên vật tư (*):</label>
                            <input type="text" class="form-control" name="item_name" value="{{ purchase.item_name }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Số PO (*):</label>
                            <input type="text" class="form-control" name="po_number" value="{{ purchase.po_number }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nhà cung cấp (*):</label>
                            <input type="text" class="form-control" name="supplier" value="{{ purchase.supplier }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">ĐVT:</label>
                            <input type="text" class="form-control" name="unit" value="{{ purchase.unit }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Số lượng (*):</label>
                            <input type="number" class="form-control" name="quantity" value="{{ purchase.quantity }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Đơn giá (*):</label>
                            <input type="number" step="any" class="form-control" name="unit_price" value="{{ purchase.unit_price }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Ngày SC nhận phiếu YC:</label>
                            <input type="date" class="form-control" name="sc_received_date" value="{{ purchase.sc_received_date }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Ngày dự kiến hàng về:</label>
                            <input type="date" class="form-control" name="expected_date" value="{{ purchase.expected_date }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Ngày nhận thực tế:</label>
                            <input type="date" class="form-control" name="received_date" value="{{ purchase.received_date }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Đánh giá vật tư:</label>
                        <input type="text" class="form-control" name="evaluation" value="{{ purchase.evaluation }}">
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('list_purchases') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-1"></i> Quay lại
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i> Lưu thay đổi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
