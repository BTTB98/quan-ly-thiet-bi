<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa Đơn Mua Hàng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4 mb-5" style="max-width: 600px;">
    <h2 class="mb-4">Chỉnh sửa Đơn Mua Hàng</h2>
    
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Mã chi phí</label>
            <input type="text" name="cost_code" class="form-control" value="{{ purchase.cost_code or '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Mã vật tư</label>
            <input type="text" name="item_code" class="form-control" value="{{ purchase.item_code or '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Tên vật tư (*)</label>
            <input type="text" name="item_name" class="form-control" required value="{{ purchase.item_name }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Số PO</label>
            <input type="text" name="po_number" class="form-control" value="{{ purchase.po_number or '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Nhà cung cấp</label>
            <input type="text" name="supplier" class="form-control" value="{{ purchase.supplier or '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Số lượng (*)</label>
            <input type="number" name="quantity" class="form-control" required min="1" value="{{ purchase.quantity }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Đơn giá (*)</label>
            <input type="number" step="any" name="unit_price" class="form-control" required min="0" value="{{ purchase.unit_price }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Ngày đặt (*)</label>
            <input type="date" name="order_date" class="form-control" required value="{{ purchase.order_date or '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Dự kiến nhận (*)</label>
            <input type="date" name="expected_date" class="form-control" required value="{{ purchase.expected_date or '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Trạng thái</label>
            <select name="status" class="form-select">
                <option value="Đang đặt" {% if purchase.status == 'Đang đặt' %}selected{% endif %}>Đang đặt</option>
                <option value="Đang vận chuyển" {% if purchase.status == 'Đang vận chuyển' %}selected{% endif %}>Đang vận chuyển</option>
                <option value="Đã nhận" {% if purchase.status == 'Đã nhận' %}selected{% endif %}>Đã nhận</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Ngày nhận thực tế</label>
            <input type="date" name="received_date" class="form-control" value="{{ purchase.received_date or '' }}">
        </div>
        <!-- Chỉnh sửa đánh giá vật tư -->
        <div class="mb-3">
            <label class="form-label">Đánh giá vật tư</label>
            <select name="evaluation" class="form-select">
                <option value="Chưa" {% if purchase.evaluation == 'Chưa' or not purchase.evaluation %}selected{% endif %}>Chưa</option>
                <option value="Có" {% if purchase.evaluation == 'Có' %}selected{% endif %}>Có</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Cập nhật đơn hàng</button>
        <a href="{{ url_for('list_purchases') }}" class="btn btn-secondary">Hủy</a>
    </form>
</body>
</html>
