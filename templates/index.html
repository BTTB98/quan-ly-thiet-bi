<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ - Hệ thống Quản lý</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Xin chào, {{ session['username'] }} (Vai trò: <strong>{{ session['role'] }}</strong>)</h2>
        <a href="{{ url_for('logout') }}" class="btn btn-danger">Đăng xuất</a>
    </div>
    
    <hr>

    <div class="list-group">
        <a href="{{ url_for('list_purchases') }}" class="list-group-item list-group-item-action mb-2">
            📦 Quản lý đơn mua hàng vật tư
        </a>
        
        {% if session.get('role') == 'admin' %}
            <a href="{{ url_for('list_users') }}" class="list-group-item list-group-item-action">
                👥 Quản lý tài khoản nhân viên
            </a>
        {% endif %}
    </div>
</body>
</html>
