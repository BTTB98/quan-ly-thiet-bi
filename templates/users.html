<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý tài khoản</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Danh sách tài khoản nhân viên</h2>
    <a href="{{ url_for('index') }}" class="btn btn-secondary mb-3">Quay lại trang chủ</a>
    <a href="{{ url_for('add_user') }}" class="btn btn-primary mb-3">+ Thêm tài khoản mới</a>

    <table class="table table-bordered text-center">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Tên đăng nhập</th>
                <th>Vai trò (Role)</th>
            </tr>
        </thead>
        <tbody>
            {% for u in users %}
            <tr>
                <td>{{ u.id }}</td>
                <td>{{ u.username }}</td>
                <td><span class="badge bg-secondary">{{ u.role }}</span></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
